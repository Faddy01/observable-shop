version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: observable-shop-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin - Database UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: observable-shop-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@observableshop.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Product Service
  product-service:
    build:
      context: ./microservices/product-service
    container_name: observable-shop-product
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: product_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./microservices/product-service/logs:/app/logs

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: observable-shop-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana - Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: observable-shop-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

  # Elasticsearch - Logging
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.0.0
    container_name: observable-shop-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  # Kibana - Log UI
  kibana:
    image: docker.elastic.co/kibana/kibana:8.0.0
    container_name: observable-shop-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: observable-shop-jaeger
    ports:
      - "6831:6831/udp"
      - "16686:16686"

volumes:
  postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

networks:
  default:
    name: observable-shop-network
